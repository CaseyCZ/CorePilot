name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (for example v0.18)"
        required: true
        type: string
  workflow_run:
    workflows: ["Build"]
    types: [completed]
    branches: [main]

permissions:
  actions: read
  contents: write

jobs:
  rolling-latest:
    if: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.head_repository.full_name == github.repository }}
    runs-on: windows-latest
    concurrency:
      group: corepilot-rolling-latest
      cancel-in-progress: true
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
      SOURCE_RUN_NUMBER: ${{ github.event.workflow_run.run_number }}
      SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}

    steps:
      - name: Validate verified current main
        shell: pwsh
        run: |
          $currentMain = gh api "repos/$env:GITHUB_REPOSITORY/branches/main" --jq ".commit.sha"
          if ($LASTEXITCODE -ne 0) {
            throw "Unable to resolve current main."
          }

          if ($currentMain -ne $env:SOURCE_SHA) {
            Write-Host "A newer main commit exists. This older Build will not replace Latest."
            "SKIP_LATEST=true" | Out-File -FilePath $env:GITHUB_ENV -Append
            exit 0
          }

          $verified = gh api "repos/$env:GITHUB_REPOSITORY/commits/$env:SOURCE_SHA" --jq ".commit.verification.verified"
          if ($LASTEXITCODE -ne 0 -or $verified -ne "true") {
            throw "Rolling Latest requires a GitHub-verified current main commit."
          }

          "SKIP_LATEST=false" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Download successful main artifact
        if: env.SKIP_LATEST != 'true'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifacts/CorePilot-win-x64 | Out-Null
          gh run download "$env:SOURCE_RUN_ID" `
            --repo "$env:GITHUB_REPOSITORY" `
            --name "CorePilot-win-x64" `
            --dir "artifacts/CorePilot-win-x64"

          if ($LASTEXITCODE -ne 0) {
            throw "Unable to download the successful Build artifact."
          }

          if (-not (Test-Path "artifacts/CorePilot-win-x64/CorePilot.exe")) {
            throw "CorePilot.exe is missing from the successful main-build artifact."
          }

      - name: Package rolling latest
        if: env.SKIP_LATEST != 'true'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifacts/release | Out-Null
          $zipName = "CorePilot-latest-win-x64.zip"
          $shaName = "CorePilot-latest-win-x64.sha256"
          $zipPath = Join-Path "artifacts/release" $zipName
          $shaPath = Join-Path "artifacts/release" $shaName

          Compress-Archive `
            -Path "artifacts/CorePilot-win-x64/*" `
            -DestinationPath $zipPath `
            -CompressionLevel Optimal `
            -Force

          $hash = (Get-FileHash -Path $zipPath -Algorithm SHA256).Hash
          "$hash  $zipName" | Set-Content $shaPath -Encoding ascii

          "ROLLING_ZIP=$zipPath" | Out-File -FilePath $env:GITHUB_ENV -Append
          "ROLLING_SHA=$shaPath" | Out-File -FilePath $env:GITHUB_ENV -Append
          "ROLLING_DIGEST=$hash" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Update rolling latest release
        if: env.SKIP_LATEST != 'true'
        shell: pwsh
        run: |
          $notes = "Rolling development build from successful Build #$env:SOURCE_RUN_NUMBER on current main.`n`nCommit: $env:SOURCE_SHA`nBuild run: $env:SOURCE_RUN_ID`nPlatform: Windows x64`nPackage: CorePilot-latest-win-x64.zip`nSHA256: $env:ROLLING_DIGEST`n`nThe source commit is GitHub-verified and passed the complete CorePilot CI pipeline."

          gh release view "latest" --repo "$env:GITHUB_REPOSITORY" *> $null
          $exists = $LASTEXITCODE -eq 0

          if ($exists) {
            gh api `
              --method PATCH `
              "repos/$env:GITHUB_REPOSITORY/git/refs/tags/latest" `
              -f "sha=$env:SOURCE_SHA" `
              -F "force=true"

            if ($LASTEXITCODE -ne 0) {
              throw "Unable to move the latest tag to current verified main."
            }

            gh release upload "latest" `
              "$env:ROLLING_ZIP" `
              "$env:ROLLING_SHA" `
              --repo "$env:GITHUB_REPOSITORY" `
              --clobber

            if ($LASTEXITCODE -ne 0) {
              throw "Unable to replace rolling Latest assets."
            }

            gh release edit "latest" `
              --repo "$env:GITHUB_REPOSITORY" `
              --title "CorePilot Latest" `
              --notes "$notes" `
              --latest

            if ($LASTEXITCODE -ne 0) {
              throw "Unable to update rolling Latest metadata."
            }
          }
          else {
            gh release create "latest" `
              "$env:ROLLING_ZIP" `
              "$env:ROLLING_SHA" `
              --repo "$env:GITHUB_REPOSITORY" `
              --target "$env:SOURCE_SHA" `
              --title "CorePilot Latest" `
              --notes "$notes" `
              --latest

            if ($LASTEXITCODE -ne 0) {
              throw "Unable to create rolling Latest."
            }
          }

  windows-release:
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: windows-latest

    steps:
      - name: Validate release version
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          if ($env:RELEASE_VERSION -notmatch '^v\d+\.\d+(\.\d+)?([+-][A-Za-z0-9.-]+)?$') {
            throw "Version must look like v0.18 or v0.18.1"
          }
          $semver = $env:RELEASE_VERSION.TrimStart('v')
          "COREPILOT_VERSION=$semver" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Checkout main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore CorePilot.sln

      - name: Validate Python EFI bridge
        run: |
          python -m py_compile src/CorePilot.MacOS/Bridge/opcore_bridge.py
          python src/CorePilot.MacOS/Bridge/opcore_bridge.py --self-test

      - name: Enforce isolated guarded disk writer
        shell: pwsh
        run: |
          $loggingPath = "src/CorePilot.MacOS/LoggingDiskOperationBackend.cs"
          $logging = Get-Content $loggingPath -Raw
          foreach ($needle in @("System.Diagnostics", "Process.Start", "CreateFile", "DeviceIoControl", "PhysicalDrive", "diskpart.exe")) {
            if ($logging.Contains($needle)) {
              throw "Simulation backend gained forbidden disk capability '$needle'."
            }
          }

          $writerPath = "src/CorePilot.MacOS/MacOSUsbPhysicalWriteService.cs"
          $writer = Get-Content $writerPath -Raw
          foreach ($needle in @(
            "confirmationVerification",
            "planVerification",
            "manifestVerification",
            "IdentityFingerprint",
            'Verb = "runas"',
            "Get-CimInstance Win32_DiskDrive",
            "VerifyMountedVolumeBelongsToTargetAsync",
            "diskpart.exe",
            "CopyAndVerifyFileAsync"
          )) {
            if (-not $writer.Contains($needle)) {
              throw "Guarded physical writer is missing required safety marker '$needle'."
            }
          }

          $diskpartReferences = Get-ChildItem src -Recurse -Filter *.cs |
            Select-String -SimpleMatch "diskpart.exe"
          foreach ($match in $diskpartReferences) {
            if ($match.Path -notlike "*MacOSUsbPhysicalWriteService.cs") {
              throw "diskpart.exe reference escaped the isolated physical writer: $($match.Path)"
            }
          }

      - name: State-machine smoke test
        run: dotnet run --project tests/CorePilot.WorkflowSmoke/CorePilot.WorkflowSmoke.csproj --configuration Release -p:Version=$env:COREPILOT_VERSION

      - name: Build
        run: dotnet build CorePilot.sln --configuration Release --no-restore -p:Version=$env:COREPILOT_VERSION

      - name: Publish Windows x64
        run: >
          dotnet publish src/CorePilot.App/CorePilot.App.csproj
          --configuration Release
          --runtime win-x64
          --self-contained true
          --output artifacts/CorePilot-win-x64
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:DebugType=None
          -p:DebugSymbols=false
          -p:Version=$env:COREPILOT_VERSION

      - name: Create versioned package
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          New-Item -ItemType Directory -Force -Path artifacts/release | Out-Null
          $zipName = "CorePilot-$env:RELEASE_VERSION-win-x64.zip"
          $zipPath = Join-Path "artifacts/release" $zipName
          Compress-Archive -Path "artifacts/CorePilot-win-x64/*" -DestinationPath $zipPath -CompressionLevel Optimal -Force
          $hash = (Get-FileHash -Path $zipPath -Algorithm SHA256).Hash
          "$hash  $zipName" | Set-Content "artifacts/release/CorePilot-$env:RELEASE_VERSION-win-x64.sha256" -Encoding ascii
          Write-Host "Release package: $zipName"
          Write-Host "SHA256: $hash"

      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          gh release view "$env:RELEASE_VERSION" --repo "$env:GITHUB_REPOSITORY" *> $null
          if ($LASTEXITCODE -eq 0) {
            throw "Release $env:RELEASE_VERSION already exists. Use a new version number."
          }

          $zip = "artifacts/release/CorePilot-$env:RELEASE_VERSION-win-x64.zip"
          $sha = "artifacts/release/CorePilot-$env:RELEASE_VERSION-win-x64.sha256"

          gh release create "$env:RELEASE_VERSION" `
            "$zip" `
            "$sha" `
            --repo "$env:GITHUB_REPOSITORY" `
            --target "$env:GITHUB_SHA" `
            --title "CorePilot $env:RELEASE_VERSION" `
            --generate-notes `
            --latest

          if ($LASTEXITCODE -ne 0) {
            throw "Unable to publish CorePilot $env:RELEASE_VERSION."
          }
