name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (for example v0.18)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  windows-release:
    runs-on: windows-latest

    steps:
      - name: Validate release version
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          if ($env:RELEASE_VERSION -notmatch '^v\d+\.\d+(\.\d+)?([+-][A-Za-z0-9.-]+)?$') {
            throw "Version must look like v0.18 or v0.18.1"
          }
          $semver = $env:RELEASE_VERSION.TrimStart('v')
          "COREPILOT_VERSION=$semver" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Checkout main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore CorePilot.sln

      - name: Validate Python EFI bridge
        run: |
          python -m py_compile src/CorePilot.MacOS/Bridge/opcore_bridge.py
          python src/CorePilot.MacOS/Bridge/opcore_bridge.py --self-test

      - name: Enforce isolated guarded disk writer
        shell: pwsh
        run: |
          $loggingPath = "src/CorePilot.MacOS/LoggingDiskOperationBackend.cs"
          $logging = Get-Content $loggingPath -Raw
          foreach ($needle in @("System.Diagnostics", "Process.Start", "CreateFile", "DeviceIoControl", "PhysicalDrive", "diskpart.exe")) {
            if ($logging.Contains($needle)) {
              throw "Simulation backend gained forbidden disk capability '$needle'."
            }
          }

          $writerPath = "src/CorePilot.MacOS/MacOSUsbPhysicalWriteService.cs"
          $writer = Get-Content $writerPath -Raw
          foreach ($needle in @(
            "confirmationVerification",
            "planVerification",
            "manifestVerification",
            "IdentityFingerprint",
            'Verb = "runas"',
            "Get-CimInstance Win32_DiskDrive",
            "VerifyMountedVolumeBelongsToTargetAsync",
            "diskpart.exe",
            "Target PNP identity changed after formatting.",
            "CopyAndVerifyFileAsync"
          )) {
            if (-not $writer.Contains($needle)) {
              throw "Guarded physical writer is missing required safety marker '$needle'."
            }
          }

          $windowsWriterPath = "src/CorePilot.Windows/WindowsInstallerUsbWriter.cs"
          $windowsWriter = Get-Content $windowsWriterPath -Raw
          foreach ($needle in @(
            "IdentityFingerprint",
            'Verb = "runas"',
            "Get-CimInstance Win32_DiskDrive",
            "diskpart.exe",
            "Mount-DiskImage",
            "dism.exe",
            "VerifyMountedVolumeBelongsToTargetAsync",
            "Target PNP identity changed after formatting.",
            "Get-FileHash",
            "BypassTPMCheck",
            "BypassSecureBootCheck",
            "convert mbr",
            "bootsect.exe",
            "customizationSha256",
            "result does not match the media mode prepared by Verify"
          )) {
            if (-not $windowsWriter.Contains($needle)) {
              throw "Guarded Windows writer is missing required safety marker '$needle'."
            }
          }

          if ($windowsWriter.Contains("BypassRAMCheck")) {
            throw "Automatic Windows media must not bypass the Windows 11 minimum RAM requirement."
          }

          $linuxWriterPath = "src/CorePilot.Linux/LinuxRawUsbWriter.cs"
          $linuxWriter = Get-Content $linuxWriterPath -Raw
          foreach ($needle in @(
            "IdentityFingerprint",
            'Verb = "runas"',
            "Get-CimInstance Win32_DiskDrive",
            "Clear-Disk",
            "IncrementalHash",
            "readBackSha256",
            "ExpectedIsoSha256",
            "Target PNP identity changed after erase preparation."
          )) {
            if (-not $linuxWriter.Contains($needle)) {
              throw "Guarded Linux writer is missing required safety marker '$needle'."
            }
          }

          $diskpartReferences = Get-ChildItem src -Recurse -Filter *.cs |
            Select-String -SimpleMatch "diskpart.exe"
          foreach ($match in $diskpartReferences) {
            if ($match.Path -notlike "*MacOSUsbPhysicalWriteService.cs" -and
                $match.Path -notlike "*WindowsInstallerUsbWriter.cs") {
              throw "diskpart.exe reference escaped the guarded physical writers: $($match.Path)"
            }
          }

          $clearDiskReferences = Get-ChildItem src -Recurse -Filter *.cs |
            Select-String -SimpleMatch "Clear-Disk"
          foreach ($match in $clearDiskReferences) {
            if ($match.Path -notlike "*LinuxRawUsbWriter.cs") {
              throw "Clear-Disk reference escaped the guarded Linux writer: $($match.Path)"
            }
          }

      - name: Enforce readable desktop UI theme
        shell: pwsh
        run: |
          $appXaml = Get-Content "src/CorePilot.App/App.xaml" -Raw
          $mainXaml = Get-Content "src/CorePilot.App/MainWindow.xaml" -Raw
          $logXaml = Get-Content "src/CorePilot.App/LogWindow.xaml" -Raw

          if ($appXaml.Contains('<Style TargetType="TextBlock">')) {
            throw "A global TextBlock style can make system-templated controls unreadable. Use explicit text colors or control-specific styles."
          }

          foreach ($needle in @(
            '<Style TargetType="ComboBox">',
            '<Style TargetType="ComboBoxItem">',
            'x:Name="PART_Popup"',
            '<Style TargetType="TabItem">',
            '<Style TargetType="TextBox">',
            '<Style TargetType="GridViewColumnHeader">'
          )) {
            if (-not $appXaml.Contains($needle)) {
              throw "Desktop theme is missing required control styling marker '$needle'."
            }
          }

          foreach ($window in @($mainXaml, $logXaml)) {
            if (-not $window.Contains('Background="{StaticResource PageBrush}"') -or
                -not $window.Contains('Foreground="{StaticResource TextBrush}"')) {
              throw "CorePilot windows must explicitly bind dark background and readable foreground."
            }
          }

      - name: State-machine smoke test
        run: dotnet run --project tests/CorePilot.WorkflowSmoke/CorePilot.WorkflowSmoke.csproj --configuration Release -p:Version=$env:COREPILOT_VERSION

      - name: Build
        run: dotnet build CorePilot.sln --configuration Release --no-restore -p:Version=$env:COREPILOT_VERSION

      - name: Publish Windows x64
        run: >
          dotnet publish src/CorePilot.App/CorePilot.App.csproj
          --configuration Release
          --runtime win-x64
          --self-contained true
          --output artifacts/CorePilot-win-x64
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:DebugType=None
          -p:DebugSymbols=false
          -p:Version=$env:COREPILOT_VERSION

      - name: Create versioned package
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          New-Item -ItemType Directory -Force -Path artifacts/release | Out-Null
          $zipName = "CorePilot-$env:RELEASE_VERSION-win-x64.zip"
          $zipPath = Join-Path "artifacts/release" $zipName
          Compress-Archive -Path "artifacts/CorePilot-win-x64/*" -DestinationPath $zipPath -CompressionLevel Optimal -Force
          $hash = (Get-FileHash -Path $zipPath -Algorithm SHA256).Hash
          "$hash  $zipName" | Set-Content "artifacts/release/CorePilot-$env:RELEASE_VERSION-win-x64.sha256" -Encoding ascii
          Write-Host "Release package: $zipName"
          Write-Host "SHA256: $hash"

      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          gh release view "$env:RELEASE_VERSION" --repo "$env:GITHUB_REPOSITORY" *> $null
          if ($LASTEXITCODE -eq 0) {
            throw "Release $env:RELEASE_VERSION already exists. Use a new version number."
          }

          $zip = "artifacts/release/CorePilot-$env:RELEASE_VERSION-win-x64.zip"
          $sha = "artifacts/release/CorePilot-$env:RELEASE_VERSION-win-x64.sha256"

          gh release create "$env:RELEASE_VERSION" `
            "$zip" `
            "$sha" `
            --repo "$env:GITHUB_REPOSITORY" `
            --target "$env:GITHUB_SHA" `
            --title "CorePilot $env:RELEASE_VERSION" `
            --generate-notes `
            --latest

          if ($LASTEXITCODE -ne 0) {
            throw "Unable to publish CorePilot $env:RELEASE_VERSION."
          }
