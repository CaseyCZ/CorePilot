name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (for example v0.18)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  windows-release:
    runs-on: windows-latest

    steps:
      - name: Validate release version
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          if ($env:RELEASE_VERSION -notmatch '^v\d+\.\d+(\.\d+)?([+-][A-Za-z0-9.-]+)?$') {
            throw "Version must look like v0.18 or v0.18.1"
          }

      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore CorePilot.sln

      - name: Validate Python EFI bridge
        run: |
          python -m py_compile src/CorePilot.MacOS/Bridge/opcore_bridge.py
          python src/CorePilot.MacOS/Bridge/opcore_bridge.py --self-test

      - name: Enforce logging-only disk backend
        shell: pwsh
        run: |
          $path = "src/CorePilot.MacOS/LoggingDiskOperationBackend.cs"
          $text = Get-Content $path -Raw
          $forbidden = @(
            "System.Diagnostics",
            "Process.Start",
            "CreateFile",
            "DeviceIoControl",
            "PhysicalDrive",
            "diskpart.exe"
          )
          foreach ($needle in $forbidden) {
            if ($text.Contains($needle)) {
              throw "Forbidden physical-disk capability marker '$needle' found in $path"
            }
          }

      - name: State-machine smoke test
        run: dotnet run --project tests/CorePilot.WorkflowSmoke/CorePilot.WorkflowSmoke.csproj --configuration Release

      - name: Build
        run: dotnet build CorePilot.sln --configuration Release --no-restore

      - name: Publish Windows x64
        run: >
          dotnet publish src/CorePilot.App/CorePilot.App.csproj
          --configuration Release
          --runtime win-x64
          --self-contained true
          --output artifacts/CorePilot-win-x64
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:DebugType=None
          -p:DebugSymbols=false

      - name: Create versioned package
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          New-Item -ItemType Directory -Force -Path artifacts/release | Out-Null
          $zipName = "CorePilot-$env:RELEASE_VERSION-win-x64.zip"
          $zipPath = Join-Path "artifacts/release" $zipName
          Compress-Archive -Path "artifacts/CorePilot-win-x64/*" -DestinationPath $zipPath -CompressionLevel Optimal -Force
          $hash = (Get-FileHash -Path $zipPath -Algorithm SHA256).Hash
          "$hash  $zipName" | Set-Content "artifacts/release/CorePilot-$env:RELEASE_VERSION-win-x64.sha256" -Encoding ascii
          Write-Host "Release package: $zipName"
          Write-Host "SHA256: $hash"

      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          gh release view "$env:RELEASE_VERSION" --repo "$env:GITHUB_REPOSITORY" *> $null
          if ($LASTEXITCODE -eq 0) {
            throw "Release $env:RELEASE_VERSION already exists. Use a new version number."
          }

          $zip = "artifacts/release/CorePilot-$env:RELEASE_VERSION-win-x64.zip"
          $sha = "artifacts/release/CorePilot-$env:RELEASE_VERSION-win-x64.sha256"

          gh release create "$env:RELEASE_VERSION" `
            "$zip" `
            "$sha" `
            --repo "$env:GITHUB_REPOSITORY" `
            --target "$env:GITHUB_SHA" `
            --title "CorePilot $env:RELEASE_VERSION" `
            --generate-notes `
            --latest

          if ($LASTEXITCODE -ne 0) {
            throw "Unable to publish CorePilot $env:RELEASE_VERSION."
          }
