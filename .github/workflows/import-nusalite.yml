name: Import NusaLite source for CorePilot preview
on:
  push:
    branches:
      - migration/nusalite-corepilot-20261111
    paths:
      - .github/workflows/import-nusalite.yml

permissions:
  contents: write

jobs:
  import:
    runs-on: windows-latest
    steps:
      - name: Checkout the protected migration branch
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Import pinned MIT NusaLite code, preserving license
        shell: pwsh
        run: ./scripts/import-nusalite.ps1
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Build migrated CorePilot
        shell: pwsh
        run: dotnet build CorePilot.csproj -c Release --nologo
      - name: Publish CorePilot executable
        shell: pwsh
        run: dotnet publish CorePilot.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:PublishTrimmed=false -o publish
      - name: Test startup
        shell: pwsh
        run: ./scripts/smoke-startup.ps1 -Executable 'publish/CorePilot.exe' -HoldSeconds 12
      - name: Save preview after successful startup
        uses: actions/upload-artifact@v4
        with:
          name: CorePilot-NusaLite-preview
          path: publish/CorePilot.exe
          if-no-files-found: error
