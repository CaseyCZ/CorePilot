name: CorePilot - Windows installer
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: corepilot-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  installer:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Verify Czech / English localization
        shell: pwsh
        run: ./scripts/check-localization.ps1

      - name: Build
        shell: pwsh
        run: dotnet build CorePilot.csproj -c Release --nologo

      - name: Publish Windows x64 app
        shell: pwsh
        run: >
          dotnet publish CorePilot.csproj -c Release -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:PublishTrimmed=false
          --output out/win-x64

      - name: Test app startup
        shell: pwsh
        run: ./scripts/smoke-startup.ps1 -Executable 'out/win-x64/CorePilot.exe' -HoldSeconds 12

      - name: Ensure installer compiler
        shell: pwsh
        run: |
          $programFiles = [Environment]::GetFolderPath('ProgramFilesX86')
          $compiler = Join-Path $programFiles 'Inno Setup 6\ISCC.exe'
          if (!(Test-Path $compiler)) {
            choco install innosetup --yes --no-progress --limit-output
            if ($LASTEXITCODE -ne 0) { throw 'Inno Setup installation failed.' }
          }
          if (!(Test-Path $compiler)) { throw 'Inno Setup compiler missing.' }

      - name: Build CorePilot-Setup.exe
        shell: pwsh
        run: |
          $programFiles = [Environment]::GetFolderPath('ProgramFilesX86')
          $compiler = Join-Path $programFiles 'Inno Setup 6\ISCC.exe'
          & $compiler 'installer\CorePilot.iss'
          if ($LASTEXITCODE -ne 0) { throw 'Installer build failed.' }
          $setup = Get-Item 'out\release\CorePilot-Setup.exe' -ErrorAction Stop
          if ($setup.Length -lt 1048576) { throw 'Installer output is unusually small.' }

      - name: Install and test CorePilot
        shell: pwsh
        run: |
          $setup = (Resolve-Path 'out/release/CorePilot-Setup.exe').Path
          $install = Start-Process -FilePath $setup -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART' -Wait -PassThru
          if ($install.ExitCode -ne 0) { throw "Installer failed with exit code $($install.ExitCode)." }
          $dir = Join-Path $env:LOCALAPPDATA 'Programs\CorePilot'
          ./scripts/smoke-startup.ps1 -Executable (Join-Path $dir 'CorePilot.exe') -HoldSeconds 12
          if (!(Test-Path (Join-Path $dir 'LICENSE')) -or !(Test-Path (Join-Path $dir 'NOTICE.md'))) {
            throw 'MIT license and attribution files must be installed.'
          }

      - name: Upload tested installer
        uses: actions/upload-artifact@v4
        with:
          name: CorePilot-Setup-tested
          path: out/release/CorePilot-Setup.exe
          if-no-files-found: error

      - name: Publish only current installer
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = 'Stop'
          & gh release view latest --json tagName 2>$null | Out-Null
          if ($LASTEXITCODE -eq 0) {
            & gh release delete latest --yes --cleanup-tag
            if ($LASTEXITCODE -ne 0) { throw 'Cannot delete old release.' }
          }
          & gh release create latest 'out/release/CorePilot-Setup.exe' --target $env:GITHUB_SHA --title 'CorePilot 2.2 for Windows' --notes-file RELEASE_NOTES.md --latest
          if ($LASTEXITCODE -ne 0) { throw 'Could not publish installer release.' }
          $release = & gh release view latest --json assets | ConvertFrom-Json
          $files = @($release.assets | ForEach-Object { $_.name })
          if ($files.Count -ne 1 -or $files[0] -ne 'CorePilot-Setup.exe') { throw "Unexpected assets: $($files -join ', ')" }
