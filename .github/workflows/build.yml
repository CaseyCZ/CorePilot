name: CorePilot Windows preview
on:
  push:
  pull_request:
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Build and validate
        run: dotnet build CorePilot.slnx -c Release --nologo
      - name: Smoke test pure logic
        run: dotnet run --project tests/CorePilot.Tests/CorePilot.Tests.csproj -c Release --no-build
      - name: Publish x64 preview
        run: dotnet publish src/CorePilot/CorePilot.csproj -c Release -r win-x64 --self-contained true -o out/win-x64
      - uses: actions/upload-artifact@v4
        with:
          name: CorePilot-win-x64-preview
          path: out/win-x64/
