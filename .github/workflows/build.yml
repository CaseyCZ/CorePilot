name: Build

permissions:
  contents: read

on:
  push:
    branches: [ main, "foundation/**", "feature/**" ]
  pull_request:
    branches: [ main ]

jobs:
  windows-build:
    runs-on: windows-latest
    env:
      COREPILOT_VERSION: 0.18.0-dev.${{ github.run_number }}

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore CorePilot.sln

      - name: Validate Python EFI bridge
        run: |
          python -m py_compile src/CorePilot.MacOS/Bridge/opcore_bridge.py
          python src/CorePilot.MacOS/Bridge/opcore_bridge.py --self-test

      - name: Enforce isolated guarded disk writer
        shell: pwsh
        run: |
          $loggingPath = "src/CorePilot.MacOS/LoggingDiskOperationBackend.cs"
          $logging = Get-Content $loggingPath -Raw
          foreach ($needle in @("System.Diagnostics", "Process.Start", "CreateFile", "DeviceIoControl", "PhysicalDrive", "diskpart.exe")) {
            if ($logging.Contains($needle)) {
              throw "Simulation backend gained forbidden disk capability '$needle'."
            }
          }

          $writerPath = "src/CorePilot.MacOS/MacOSUsbPhysicalWriteService.cs"
          $writer = Get-Content $writerPath -Raw
          foreach ($needle in @(
            "confirmationVerification",
            "planVerification",
            "manifestVerification",
            "IdentityFingerprint",
            'Verb = "runas"',
            "Get-CimInstance Win32_DiskDrive",
            "VerifyMountedVolumeBelongsToTargetAsync",
            "diskpart.exe",
            "CopyAndVerifyFileAsync"
          )) {
            if (-not $writer.Contains($needle)) {
              throw "Guarded physical writer is missing required safety marker '$needle'."
            }
          }

          $diskpartReferences = Get-ChildItem src -Recurse -Filter *.cs |
            Select-String -SimpleMatch "diskpart.exe"
          foreach ($match in $diskpartReferences) {
            if ($match.Path -notlike "*MacOSUsbPhysicalWriteService.cs") {
              throw "diskpart.exe reference escaped the isolated physical writer: $($match.Path)"
            }
          }

      - name: State-machine smoke test
        run: dotnet run --project tests/CorePilot.WorkflowSmoke/CorePilot.WorkflowSmoke.csproj --configuration Release

      - name: Build
        run: dotnet build CorePilot.sln --configuration Release --no-restore -p:Version=$env:COREPILOT_VERSION

      - name: Publish Windows x64 test build
        run: >
          dotnet publish src/CorePilot.App/CorePilot.App.csproj
          --configuration Release
          --runtime win-x64
          --self-contained true
          --output artifacts/CorePilot-win-x64
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:DebugType=None
          -p:DebugSymbols=false
          -p:Version=$env:COREPILOT_VERSION

      - name: Upload CorePilot test build
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: CorePilot-win-x64
          path: artifacts/CorePilot-win-x64/
          if-no-files-found: error
          retention-days: 14
