name: Build

permissions:
  contents: write

on:
  push:
    branches: [ main, "foundation/**", "feature/**" ]
  pull_request:
    branches: [ main ]

jobs:
  windows-build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore CorePilot.sln

      - name: Validate Python EFI bridge
        run: |
          python -m py_compile src/CorePilot.MacOS/Bridge/opcore_bridge.py
          python src/CorePilot.MacOS/Bridge/opcore_bridge.py --self-test

      - name: Enforce logging-only disk backend
        shell: pwsh
        run: |
          $path = "src/CorePilot.MacOS/LoggingDiskOperationBackend.cs"
          $text = Get-Content $path -Raw
          $forbidden = @(
            "System.Diagnostics",
            "Process.Start",
            "CreateFile",
            "DeviceIoControl",
            "PhysicalDrive",
            "diskpart.exe"
          )
          foreach ($needle in $forbidden) {
            if ($text.Contains($needle)) {
              throw "Forbidden physical-disk capability marker '$needle' found in $path"
            }
          }

      - name: State-machine smoke test
        run: dotnet run --project tests/CorePilot.WorkflowSmoke/CorePilot.WorkflowSmoke.csproj --configuration Release

      - name: Build
        run: dotnet build CorePilot.sln --configuration Release --no-restore

      - name: Publish Windows x64 test build
        run: >
          dotnet publish src/CorePilot.App/CorePilot.App.csproj
          --configuration Release
          --runtime win-x64
          --self-contained true
          --output artifacts/CorePilot-win-x64
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:DebugType=None
          -p:DebugSymbols=false

      - name: Upload CorePilot test build
        uses: actions/upload-artifact@v4
        with:
          name: CorePilot-win-x64
          path: artifacts/CorePilot-win-x64/
          if-no-files-found: error
          retention-days: 14

      - name: Create rolling release package
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifacts/release | Out-Null

          $zip = "artifacts/release/CorePilot-latest-win-x64.zip"
          if (Test-Path $zip) {
            Remove-Item $zip -Force
          }

          Compress-Archive `
            -Path "artifacts/CorePilot-win-x64/*" `
            -DestinationPath $zip `
            -CompressionLevel Optimal `
            -Force

          $hash = (Get-FileHash -Path $zip -Algorithm SHA256).Hash
          "$hash  CorePilot-latest-win-x64.zip" |
            Set-Content "artifacts/release/CorePilot-latest-win-x64.sha256" -Encoding ascii

          Write-Host "Release package SHA256: $hash"

      - name: Update rolling GitHub Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view latest --repo "$env:GITHUB_REPOSITORY" *> $null

          if ($LASTEXITCODE -eq 0) {
            Write-Host "Removing previous rolling release..."
            gh release delete latest `
              --repo "$env:GITHUB_REPOSITORY" `
              --yes `
              --cleanup-tag

            if ($LASTEXITCODE -ne 0) {
              throw "Unable to remove previous rolling release."
            }
          }
          else {
            Write-Host "No previous rolling release exists yet."
          }

          $short = "$env:GITHUB_SHA".Substring(0, 8)
          $notes = @"
          Rolling development build from the latest successful main branch.

          Commit: $short
          Platform: Windows x64
          Package: CorePilot-latest-win-x64.zip
          Integrity: CorePilot-latest-win-x64.sha256

          This release is updated automatically only after the complete CorePilot CI pipeline succeeds.
          "@

          gh release create latest `
            "artifacts/release/CorePilot-latest-win-x64.zip" `
            "artifacts/release/CorePilot-latest-win-x64.sha256" `
            --repo "$env:GITHUB_REPOSITORY" `
            --target "$env:GITHUB_SHA" `
            --title "CorePilot Latest" `
            --notes "$notes" `
            --latest

          if ($LASTEXITCODE -ne 0) {
            throw "Unable to publish the rolling CorePilot release."
          }
