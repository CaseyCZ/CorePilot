name: CorePilot - verify Windows preview
on:
  push:
    branches: [main, 'migration/**']
  pull_request:
    branches: [main, 'migration/**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Build
        shell: pwsh
        run: dotnet build CorePilot.csproj -c Release --nologo
      - name: Publish
        shell: pwsh
        run: dotnet publish CorePilot.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:PublishTrimmed=false -o publish
      - name: Verify startup
        shell: pwsh
        run: ./scripts/smoke-startup.ps1 -Executable 'publish/CorePilot.exe' -HoldSeconds 12
      - name: Upload preview build
        uses: actions/upload-artifact@v4
        with:
          name: CorePilot-preview
          path: publish/CorePilot.exe
          if-no-files-found: error
